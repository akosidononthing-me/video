<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>On Thing Connect</title><style>body{margin:0;background:#0b1220;color:#edf5ff;font:16px system-ui}header{padding:20px 5%;border-bottom:1px solid #29364c;font-size:24px;font-weight:700}main{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:#172338;border:1px solid #2d3e56;border-radius:16px;padding:22px;margin-bottom:20px}button,input{padding:12px 16px;border-radius:9px;border:0;font:inherit}button{background:#13b8c9;color:#041a25;cursor:pointer;font-weight:650;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}input{background:#0b1220;color:white;border:1px solid #51617b;max-width:180px}.videos{display:grid;grid-template-columns:2fr 1fr;gap:15px}video{width:100%;background:#050a13;border-radius:12px;aspect-ratio:16/9;object-fit:contain}.muted{color:#9fb2cb}#call{display:none}#file{max-width:230px}#status{color:#7fe0ee}@media(max-width:700px){.videos{grid-template-columns:1fr}}</style></head><body><header>◉ On Thing Connect</header><main><section id="entry" class="panel"><h2>Join a video room</h2><button id="create">Create Admin Room</button><p>Or join as a client:</p><input id="code" placeholder="Room code" maxlength="6"><button id="join">Join Room</button><p id="entryError" class="muted"></p></section><section id="call"><div class="panel"><strong id="role"></strong> · Room <strong id="room"></strong> <button id="copy">Copy Code</button><p id="status">Waiting for connection...</p></div><div class="videos"><div><h3>Remote video</h3><video id="remote" autoplay playsinline controls></video></div><div><h3>Your preview</h3><video id="local" autoplay playsinline muted></video></div></div><div class="panel"><button id="cam">Start Camera</button><button id="mic">Mute Mic</button><span id="adminTools" style="display:none"><input id="file" type="file" accept="video/*"><button id="useFile">Broadcast Video File</button><button id="useCam">Broadcast Camera</button></span><button id="end">End Call</button><p class="muted">Allow camera/microphone access when prompted. Video files broadcast from the admin browser while playback runs.</p></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
