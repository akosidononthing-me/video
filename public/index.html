<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>On-Tour | Apartment Tour Presentation</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b1120; color: white; }
        .navbar { display: flex; justify-content: space-between; padding: 20px 50px; background: #111827; align-items: center; }
        .logo { color: #facc15; font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .nav-links a { color: white; text-decoration: none; margin: 0 15px; }
        .nav-links a.active { color: #facc15; border-bottom: 2px solid #facc15; padding-bottom: 5px; }
        .admin-login-btn { background: #facc15; color: #111827; padding: 10px 20px; border-radius: 6px; font-weight: bold; text-decoration: none; }
        
        .hero { display: flex; padding: 50px; gap: 40px; }
        .hero-content { flex: 1; }
        .hero-content h1 { font-size: 48px; margin-bottom: 10px; }
        .hero-content h1 span { color: #facc15; }
        
        .join-box { background: #1f2937; padding: 30px; border-radius: 12px; margin-top: 30px; max-width: 400px; }
        .join-box input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: none; background: #374151; color: white; font-size: 16px; box-sizing: border-box; }
        .join-btn { width: 100%; padding: 15px; background: #facc15; color: #111827; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🏠 On-Tour</div>
        <div class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Apartments</a>
            <a href="#">How It Works</a>
            <a href="#">Contact</a>
        </div>
        <a href="admin.html" class="admin-login-btn">🔒 Admin Login</a>
    </nav>

    <div class="hero">
        <div class="hero-content">
            <h1>On-Tour<br><span>Apartment Tour Presentation</span></h1>
            <p>Experience modern living from anywhere. Join a live, interactive apartment tour with our team — real-time, personal, and convenient.</p>
            
            <div class="join-box">
                <h2>Join a Live Tour</h2>
                <input type="text" id="roomCodeInput" placeholder="Enter Room Code (e.g. 1023)">
                <button class="join-btn" id="joinBtn">🎥 Join Tour</button>
                <p id="errorMsg" style="color: #ef4444; margin-top: 10px; display: none;"></p>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const joinBtn = document.getElementById('joinBtn');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const errorMsg = document.getElementById('errorMsg');

        joinBtn.addEventListener('click', () => {
            const code = roomCodeInput.value.trim();
            if (code) {
                socket.emit('join-room', code);
            }
        });

        socket.on('join-success', (roomCode) => {
            // Store role and room in sessionStorage, then redirect to the live room UI
            sessionStorage.setItem('role', 'client');
            sessionStorage.setItem('roomCode', roomCode);
            window.location.href = 'live-tour.html';
        });

        socket.on('join-error', (msg) => {
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        });
    </script>
</body>
</html>
