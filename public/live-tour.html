<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Tour | On-Tour</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b1120; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background-color: #111827; border-bottom: 1px solid #1f2937; }
        .logo { color: white; font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logo span { color: #facc15; }
        .room-info { font-size: 18px; font-weight: bold; }
        .client-count { display: flex; align-items: center; gap: 10px; color: #9ca3af; }

        .workspace { display: flex; flex: 1; overflow: hidden; }

        .video-container { flex: 1; position: relative; display: flex; flex-direction: column; background: #000; }
        #mainVideo { width: 100%; height: 100%; object-fit: cover; }
        
        .pip-wrapper { position: absolute; top: 20px; right: 20px; width: 240px; height: 160px; border-radius: 12px; overflow: hidden; border: 2px solid #374151; box-shadow: 0 10px 25px rgba(0,0,0,0.5); background: #111827; }
        #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .pip-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; font-size: 12px; }

        .controls { position: absolute; bottom: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; justify-content: center; gap: 20px; }
        .ctrl-btn { background: #1f2937; border: none; color: white; width: 60px; height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; font-size: 12px; }
        .ctrl-btn:hover { background: #374151; }
        .end-btn { background: #ef4444; width: auto; padding: 0 30px; font-size: 14px; font-weight: bold; border-radius: 30px; color: white; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }

        .sidebar { width: 350px; background: #111827; border-left: 1px solid #1f2937; display: flex; flex-direction: column; }
        .chat-header { padding: 20px; border-bottom: 1px solid #1f2937; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { font-size: 14px; }
        .msg-sender { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
        .msg-bubble { background: #1f2937; padding: 10px 15px; border-radius: 8px; display: inline-block; }
        .chat-input { padding: 20px; border-top: 1px solid #1f2937; display: flex; gap: 10px; }
        .chat-input input { flex: 1; background: #1f2937; border: 1px solid #374151; padding: 12px; border-radius: 6px; color: white; }
        .send-btn { background: transparent; border: none; color: #facc15; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo">🏠 <span>On-Tour</span></div>
        <div class="room-info">Room: <span id="displayRoomCode">----</span></div>
        <div class="client-count">👥 <span id="clientCount">0 Clients Connected</span></div>
    </header>

    <div class="workspace">
        <div class="video-container">
            <video id="mainVideo" autoplay playsinline></video>
            
            <div class="pip-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="pip-label">You</div>
            </div>

            <div class="controls">
                <button class="ctrl-btn">📷<span>Camera</span></button>
                <button class="ctrl-btn">🎤<span>Mic</span></button>
                <button class="end-btn" id="leaveBtn">Leave Tour</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="chat-header">Room Chat</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button class="send-btn" id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="tour-app.js"></script>
</body>
</html>
