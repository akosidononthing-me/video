<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Client - Video Call</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <header class="top-bar">
        <div class="header-left">
            <h2>Video Call <span class="badge">Live</span></h2>
            <p>Admin Client • Monitoring</p>
        </div>
        <div class="header-right">
            <div class="timer">⏱ 00:12:34</div>
            <button class="btn-danger">End Call</button>
        </div>
    </header>

    <main class="dashboard">
        <section class="video-section">
            <div class="video-wrapper">
                <span class="video-label top-left">Worker 1 (Admin View)</span>
                <video id="remoteVideo" autoplay playsinline></video>
                <span class="video-label bottom-left">Worker 1</span>
            </div>
        </section>

        <aside class="sidebar">
            <div class="tabs">
                <button class="active">Chat</button>
                <button>Participants</button>
            </div>
            
            <div class="chat-area">
                <div class="message admin">
                    <p>Hello Worker 1, can you confirm you received the task?</p>
                </div>
                <div class="message worker">
                    <p>Yes, I received it. I'm on it now.</p>
                </div>
            </div>
            
            <div class="chat-input">
                <input type="text" placeholder="Type a message...">
            </div>

            <div class="call-controls">
                <h3>Call Controls</h3>
                <div class="control-buttons">
                    <button class="ctrl-btn">🎤<span>Audio</span></button>
                    <button class="ctrl-btn danger">⏺<span>Record</span></button>
                    <button class="ctrl-btn">🔍<span>Zoom</span></button>
                    <button class="ctrl-btn">⛶<span>Full Screen</span></button>
                </div>
            </div>
        </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="admin.js"></script>
</body>
</html>
