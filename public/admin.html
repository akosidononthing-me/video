<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | On-Tour</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #0b1120; color: white; display: flex; height: 100vh; }
        
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1120; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #1f2937; padding: 40px; border-radius: 12px; width: 300px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: #facc15; color: #111827; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .sidebar { width: 250px; background: #111827; padding: 20px; border-right: 1px solid #1f2937; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .create-btn { background: #facc15; color: #111827; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .stats { display: flex; gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1f2937; padding: 20px; border-radius: 12px; flex: 1; }
        
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .room-card { background: #1f2937; border-radius: 12px; overflow: hidden; border: 1px solid #374151; }
        .room-info { padding: 20px; }
        .room-code-display { background: #111827; padding: 10px; border-radius: 6px; margin: 15px 0; text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .room-actions { display: flex; gap: 10px; }
        .open-btn { flex: 1; background: #facc15; color: #111827; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .end-btn { flex: 1; background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Password">
            <button onclick="login()">Login</button>
            <p id="loginError" style="color: #ef4444; display: none; font-size: 14px;">Invalid password</p>
        </div>
    </div>

    <div class="sidebar">
        <div style="color: #facc15; font-size: 20px; font-weight: bold; margin-bottom: 40px;">🏠 On-Tour</div>
        <div style="color: white; margin-bottom: 20px;">Dashboard</div>
        <div style="color: #9ca3af; margin-bottom: 20px;">Live Rooms</div>
    </div>

    <div class="main-content" id="dashboard">
        <div class="header">
            <div>
                <h1 style="margin:0;">Admin Dashboard</h1>
                <p style="color: #9ca3af; margin-top: 5px;">Manage your live apartment tours</p>
            </div>
            <button class="create-btn" id="createRoomBtn">+ Create New Room</button>
        </div>

        <div class="stats">
            <div class="stat-card">🎥 Active Rooms: <span id="activeCount">0</span></div>
            <div class="stat-card">👥 Connected Clients: <span id="clientCount">0</span></div>
        </div>

        <h2>Active Rooms</h2>
        <div class="rooms-grid" id="roomsContainer"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        async function login() {
            const password = document.getElementById('adminPassword').value;
            const res = await fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        document.getElementById('createRoomBtn').addEventListener('click', () => {
            socket.emit('create-room');
        });

        socket.on('room-created', (roomCode) => {
            let count = parseInt(document.getElementById('activeCount').innerText);
            document.getElementById('activeCount').innerText = count + 1;
            
            const card = document.createElement('div');
            card.className = 'room-card';
            card.innerHTML = `
                <div style="background: #374151; height: 150px; display: flex; justify-content: center; align-items: center; color: #9ca3af;">Camera Preview</div>
                <div class="room-info">
                    <h3>New Live Tour</h3>
                    <div class="room-code-display">${roomCode}</div>
                    <div class="room-actions">
                        <button class="open-btn" onclick="openRoom('${roomCode}')">Open Room</button>
                        <button class="end-btn" onclick="endRoom(this, '${roomCode}')">End Room</button>
                    </div>
                </div>
            `;
            document.getElementById('roomsContainer').appendChild(card);
        });

        function openRoom(roomCode) {
            sessionStorage.setItem('role', 'admin');
            sessionStorage.setItem('roomCode', roomCode);
            window.location.href = 'live-tour.html';
        }

        function endRoom(btn, roomCode) {
            socket.emit('delete-room', roomCode);
            btn.parentElement.parentElement.parentElement.remove(); 
            let count = parseInt(document.getElementById('activeCount').innerText);
            document.getElementById('activeCount').innerText = Math.max(0, count - 1);
        }
    </script>
</body>
</html>
